name: Blog Autopilot

on:
  schedule:
    # Setiap hari pukul 00:30 UTC = 07:30 WIB (pagi, jam santai orang membaca)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topik spesifik (opsional; kosongkan untuk otomatis dari berita/rotasi pilar)"
        required: false
        type: string
      dry_run:
        description: "Jalankan tanpa menulis file / commit / sinkronisasi"
        required: false
        type: boolean
        default: false
      force:
        description: "Paksa tulis meskipun hari ini sudah ada artikel"
        required: false
        type: boolean
        default: false

concurrency:
  group: blog-autopilot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tulis artikel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CF_GATEWAY_API_KEY: ${{ secrets.CF_GATEWAY_API_KEY }}
          CF_GATEWAY_URL: ${{ secrets.CF_GATEWAY_URL }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
          LLM_API_KEY: ${{ secrets.AGY_API_KEY || secrets.LLM_API_KEY || secrets.API_KEY || secrets.CF_GATEWAY_API_KEY || secrets.GEMINI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.AGY_BASE_URL || 'https://er-ai-api.mooo.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_BASE_URL: https://ajoroby.is-a.dev
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$INPUT_TOPIC" ]; then ARGS+=(--topic "$INPUT_TOPIC"); fi
          if [ "$INPUT_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
          pnpm tsx scripts/blog-autopilot.ts "${ARGS[@]}"

      - name: Verifikasi
        if: inputs.dry_run != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm types:check
          if [ -n "$DATABASE_URL" ]; then
            pnpm build
          else
            echo "DATABASE_URL tidak diisi: lewati build penuh (Vercel tetap membangun saat deploy)."
          fi

      - name: Commit & push
        id: commit
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "robyajo-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog releases scripts/blog-pipeline/published.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan (mungkin sudah tayang hari ini)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUMMARY=$(git diff --cached --name-only | tr '\n' ' ')
          git commit -m "Blog: artikel harian" -m "$SUMMARY"
          git pull --rebase origin master
          git push origin master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sinkronkan ke API kegiatan
        if: inputs.dry_run != 'true' && steps.commit.outputs.changed == 'true'
        env:
          ACTIVITY_PROJECT_KEYS: ${{ secrets.ACTIVITY_PROJECT_KEYS }}
        run: pnpm tsx scripts/blog-autopilot.ts --sync

      - name: Laporkan kegagalan sebagai issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Blog Autopilot gagal: $(date +'%Y-%m-%d')" \
            --body "Workflow gagal pada run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --label "bug" || true
